name: "MCP CapaGate"
description: "Scan MCP tool definitions, compile least-privilege policy, and publish capability-aware security reports."
author: "MCP CapaGate contributors"
branding:
  icon: "shield"
  color: "green"
inputs:
  config:
    description: "Path to capagate.yaml"
    required: false
    default: "capagate.yaml"
  fail-on:
    description: "Fail threshold: medium, high, or critical"
    required: false
    default: "high"
  report-dir:
    description: "Directory for scan and report artifacts"
    required: false
    default: "reports"
  baseline:
    description: "Optional path to a saved CapaGate baseline JSON record"
    required: false
    default: ""
  fail-on-drift:
    description: "Fail threshold for baseline drift: medium, high, or critical"
    required: false
    default: "high"
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Enable pnpm
      shell: bash
      run: corepack enable
    - name: Install dependencies
      shell: bash
      run: pnpm --dir "$GITHUB_ACTION_PATH" install --frozen-lockfile
    - name: Build
      shell: bash
      run: pnpm --dir "$GITHUB_ACTION_PATH" build
    - name: Prepare report directory
      shell: bash
      run: mkdir -p "$GITHUB_WORKSPACE/${{ inputs.report-dir }}"
    - name: Scan MCP tools
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/packages/cli/dist/index.js" scan \
          --config "$GITHUB_WORKSPACE/${{ inputs.config }}" \
          --out "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/scan.json"
    - name: Compile policy
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/packages/cli/dist/index.js" policy \
          --input "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/scan.json" \
          --out "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/capagate.policy.yaml"
    - name: Generate report
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/packages/cli/dist/index.js" report \
          --scan "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/scan.json" \
          --policy "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/capagate.policy.yaml" \
          --html "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/index.html" \
          --markdown "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/summary.md" \
          --sarif "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/capagate.sarif"
    - name: Verify baseline drift
      shell: bash
      run: |
        if [ -z "${{ inputs.baseline }}" ]; then
          echo "No MCP CapaGate baseline configured." > "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/drift-summary.md"
          exit 0
        fi

        set +e
        node "$GITHUB_ACTION_PATH/packages/cli/dist/index.js" baseline verify \
          --baseline "$GITHUB_WORKSPACE/${{ inputs.baseline }}" \
          --current "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/scan.json" \
          --fail-on "${{ inputs.fail-on-drift }}" \
          --out "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/drift.json"
        status=$?
        set -e

        node -e '
          const fs = require("fs");
          const path = process.argv[1];
          const report = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, "utf8")) : { findings: [] };
          const lines = ["## Baseline Drift", ""];
          lines.push(`Findings: ${report.findings.length}`);
          for (const finding of report.findings.slice(0, 20)) {
            lines.push(`- [${finding.severity}] ${finding.message}`);
          }
          fs.writeFileSync(process.argv[2], `${lines.join("\n")}\n`);
        ' "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/drift.json" "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/drift-summary.md"
        cat "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/drift-summary.md" >> "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/summary.md"
        exit $status
    - name: Write GitHub step summary
      if: always()
      shell: bash
      run: |
        cat "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Enforce risk threshold
      shell: bash
      run: |
        node -e '
          const fs = require("fs");
          const scan = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
          const failOn = process.argv[2];
          const rank = { medium: 2, high: 3, critical: 4 };
          const counts = scan.summary.risk_counts || {};
          const hit =
            (rank[failOn] <= 2 && (counts.medium || 0) > 0) ||
            (rank[failOn] <= 3 && (counts.high || 0) > 0) ||
            (rank[failOn] <= 4 && (counts.critical || 0) > 0);
          if (hit) {
            console.error(`MCP CapaGate failed because findings reached ${failOn}.`);
            process.exit(1);
          }
        ' "$GITHUB_WORKSPACE/${{ inputs.report-dir }}/scan.json" "${{ inputs.fail-on }}"

project:
  name: "MCP CapaGate Demo"
  owner: "AI Security Team"

inputs:
  tools: "./examples/refund-server/tools.json"

policy:
  defaults:
    unknown_tool: block
    fail_closed: true
  approval:
    interactive: false
  thresholds:
    fail_on: high

runtime:
  mode: shadow
  audit_log: ".capagate/audit.jsonl"
  redact_responses: true

drift:
  enabled: true
  baseline: ".capagate/baseline.json"
  block_on_high_or_critical_change: true

response_scanning:
  redact_secrets: true
  redact_pii: true
  block_external_exfiltration_markers: true
